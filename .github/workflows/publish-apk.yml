name: Publish Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-apk.yml'

permissions:
  contents: write

concurrency:
  group: publish-apk-v3.7.2
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download original APK from provided Google Drive file
        run: |
          python3 -m pip install --quiet gdown==5.2.1
          gdown 'https://drive.google.com/uc?id=1OzdL8Qg3J9pL6t22Rcybse_w556MjVhV' -O meo-xay-to.apk
      - name: Verify exact APK checksum
        run: |
          echo 'e1e14aa0ef7f618604e4b5d30dc420fefb95503be3d0bc7a9b89a978ea8fd5dd  meo-xay-to.apk' | sha256sum --check
      - name: Attach verified APK to existing Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v3.7.2 meo-xay-to.apk --repo '${{ github.repository }}'
